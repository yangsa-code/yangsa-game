<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23ff7043'/%3E%3Cstop offset='1' stop-color='%23c62828'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M32 4 L58 14 V32 C58 46 48 56 32 60 C16 56 6 46 6 32 V14 Z' fill='url(%23g)' stroke='%23fff' stroke-width='3'/%3E%3Cpath d='M32 18 L32 40' stroke='%23fff' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='48' r='3.5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23ff7043'/%3E%3Cstop offset='1' stop-color='%23c62828'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M32 4 L58 14 V32 C58 46 48 56 32 60 C16 56 6 46 6 32 V14 Z' fill='url(%23g)' stroke='%23fff' stroke-width='3'/%3E%3Cpath d='M32 18 L32 40' stroke='%23fff' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='48' r='3.5' fill='%23fff'/%3E%3C/svg%3E">
<title>🛡️ 线上试岗刷单流水兼职骗局 · 反诈交互剧本（加强版）</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",sans-serif;}
  body{
    background:linear-gradient(135deg,#0a2540 0%,#1a4d6e 50%,#0d5c5c 100%);
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px;
    color:#222;
  }
  /* ===== 手机外壳 ===== */
  .phone{
    width:430px;max-width:100%;height:min(800px,94vh);
    background:#f3f0ea;border-radius:34px;
    box-shadow:0 24px 60px rgba(0,0,0,.5),0 0 0 10px #1c1c1c,0 0 0 12px #2a2a2a;
    display:flex;flex-direction:column;overflow:hidden;position:relative;
  }
  /* 顶部状态条 */
  .topbar{
    background:linear-gradient(180deg,#1f3a5f,#15263d);
    color:#fff;padding:14px 16px 12px;display:flex;align-items:center;gap:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.2);position:relative;z-index:5;
    transition:background .4s;
  }
  .topbar .avatar{
    width:42px;height:42px;border-radius:50%;
    background:linear-gradient(135deg,#ff8a65,#e53935);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    border:2px solid rgba(255,255,255,.25);
    transition:background .4s;
  }
  .topbar .avatar svg{width:26px;height:26px;}
  .topbar.conv-police{background:linear-gradient(180deg,#0d3d7a,#092a55);}
  .topbar.conv-police .avatar{background:linear-gradient(135deg,#42a5f5,#1565c0);}
  .topbar.conv-group{background:linear-gradient(180deg,#33524a,#20362f);}
  .topbar.conv-group .avatar{background:linear-gradient(135deg,#26a69a,#00695c);}
  .topbar .info{flex:1;min-width:0;}
  .topbar .name{font-size:15px;font-weight:bold;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar .sub{font-size:11px;color:#9fb3c8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .badge{color:#fff;font-size:9px;padding:1px 5px;border-radius:6px;font-weight:normal;flex-shrink:0;}
  .badge.bd-green{background:#4caf50;}
  .badge.bd-blue{background:#1e88e5;}
  .badge.bd-org{background:#fb8c00;}
  .badge.bd-gray{background:#78909c;}
  .moneybox{
    background:rgba(0,0,0,.28);border-radius:10px;padding:6px 10px;text-align:center;min-width:88px;
    border:1px solid rgba(255,255,255,.1);flex-shrink:0;
  }
  .moneybox .lbl{font-size:9px;color:#9fb3c8;letter-spacing:1px;}
  .moneybox .val{font-size:15px;font-weight:bold;color:#ffd54f;font-family:"Courier New",monospace;}
  .moneybox .val.neg{color:#ff5252;}
  .moneybox .val.pos{color:#69f0ae;}

  /* ===== 聊天区（三会话） ===== */
  .chat{flex:1;display:none;overflow-y:auto;padding:14px 12px 20px;scroll-behavior:smooth;
    background:linear-gradient(180deg,rgba(243,240,234,.96),rgba(243,240,234,.99));
  }
  .chat.on{display:block;}
  #chat-group{background:linear-gradient(180deg,#f5f1e8,#efe9db);}
  #chat-scam{background:linear-gradient(180deg,#f6f4f0,#f1ede5);}
  #chat-police{background:linear-gradient(180deg,#ecf3fb,#e2ecf8);}
  .chat::-webkit-scrollbar{width:4px;}
  .chat::-webkit-scrollbar-thumb{background:rgba(0,0,0,.2);border-radius:2px;}

  .row{display:flex;gap:8px;margin-bottom:12px;align-items:flex-start;animation:popin .32s ease both;}
  .row.right{flex-direction:row-reverse;}
  @keyframes popin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .av{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;color:#fff;box-shadow:0 2px 5px rgba(0,0,0,.15),inset 0 0 0 1.5px rgba(255,255,255,.25);}
  .av svg{width:20px;height:20px;}
  .av.ai{background:linear-gradient(135deg,#ff8a65,#e53935);}
  .av.police{background:linear-gradient(135deg,#42a5f5,#1565c0);}
  .av.me{background:linear-gradient(135deg,#4dd0e1,#0288d1);}

  .bubble{
    max-width:75%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.55;
    word-break:break-word;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.08);
  }
  .bubble.ai{background:#fff;color:#222;border-top-left-radius:4px;}
  .bubble.me{background:linear-gradient(135deg,#66bb6a,#43a047);color:#fff;border-top-right-radius:4px;box-shadow:0 2px 6px rgba(67,160,71,.25);}
  .bubble .time{display:block;font-size:9px;opacity:.55;margin-top:3px;text-align:right;}

  /* 群聊消息 */
  .gav{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:14px;box-shadow:0 2px 5px rgba(0,0,0,.15),inset 0 0 0 1.5px rgba(255,255,255,.25);}
  .gcol{max-width:80%;min-width:0;}
  .gname{font-size:10px;margin-bottom:3px;letter-spacing:.5px;font-weight:bold;opacity:.9;}
  .row.g .bubble{max-width:100%;}
  .gsys{margin:8px auto;max-width:88%;text-align:center;font-size:10.5px;color:#8a8378;background:rgba(0,0,0,.05);border-radius:8px;padding:5px 10px;animation:popin .3s ease both;}

  /* 心理 OS */
  .os{
    margin:8px auto;max-width:88%;background:linear-gradient(135deg,#ede7f6,#d1c4e9);
    border:1px dashed #7e57c2;border-radius:12px;padding:9px 14px;font-size:12.5px;color:#4527a0;
    line-height:1.55;position:relative;animation:popin .4s ease both;
  }
  .os::before{content:"💭 心理OS";display:block;font-size:10px;font-weight:bold;color:#7e57c2;margin-bottom:3px;letter-spacing:1px;}

  /* 系统警示 */
  .sys{
    margin:10px auto;max-width:92%;border-radius:12px;padding:10px 14px;font-size:12.5px;line-height:1.55;
    text-align:center;position:relative;animation:shakeIn .5s ease both;
  }
  .sys.warn{background:linear-gradient(135deg,#fff3e0,#ffe0b2);border:1.5px solid #fb8c00;color:#e65100;}
  .sys.danger{background:linear-gradient(135deg,#ffebee,#ffcdd2);border:2px solid #c62828;color:#b71c1c;font-weight:bold;}
  .sys.heavy{
    background:linear-gradient(135deg,#3e0000,#7c0000);color:#fff;border:2px solid #ff5252;
    font-weight:bold;box-shadow:0 0 18px rgba(255,82,82,.4);
  }
  .sys .ic{display:inline-block;width:18px;height:18px;vertical-align:middle;margin-right:6px;}
  @keyframes shakeIn{0%{opacity:0;transform:translateY(-6px) scale(.96);}60%{transform:translateY(2px) scale(1.02);}100%{opacity:1;transform:none;}}

  /* 旁白 */
  .narrate{margin:10px auto;max-width:92%;text-align:center;font-size:12px;color:#666;line-height:1.6;
    padding:8px 14px;background:rgba(0,0,0,.04);border-radius:10px;font-style:italic;}

  /* 章节卡 */
  .chapter{
    margin:16px auto 12px;max-width:92%;text-align:center;font-size:13.5px;font-weight:bold;
    color:#134e6f;letter-spacing:2px;padding:10px 8px;animation:popin .45s ease both;position:relative;
  }
  .chapter::before,.chapter::after{content:"———";color:#a8bfce;margin:0 8px;font-weight:normal;letter-spacing:0;}

  /* 招聘广告卡 */
  .jobad{
    margin:10px auto;max-width:92%;background:linear-gradient(135deg,#fffde7,#fff9c4);
    border:1.5px solid #fbc02d;border-radius:12px;padding:12px 14px;font-size:13px;color:#33281a;
    line-height:1.6;box-shadow:0 3px 8px rgba(251,192,45,.25);position:relative;
  }
  .jobad .tag{display:inline-block;background:#ff6f00;color:#fff;font-size:10px;padding:2px 7px;border-radius:6px;margin-bottom:6px;font-weight:bold;}
  .jobad .title{font-weight:bold;font-size:14px;margin-bottom:4px;color:#e65100;}
  .jobad .feat{font-size:11px;color:#795548;margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;}
  .jobad .feat span{background:rgba(230,81,0,.1);padding:2px 6px;border-radius:5px;}

  /* 国家反诈中心 APP 弹窗 */
  .appalert{
    margin:10px auto;max-width:86%;background:linear-gradient(135deg,#e8f1fd,#d6e7fb);
    border:1.5px solid #1e6fd0;border-radius:14px;padding:12px 16px;text-align:center;
    box-shadow:0 4px 14px rgba(30,111,208,.25);animation:shakeIn .5s ease both;
  }
  .appalert .app-ic{font-size:26px;display:block;}
  .appalert .app-name{font-size:13px;font-weight:bold;color:#0d47a1;margin:3px 0 6px;letter-spacing:1px;}
  .appalert .app-body{font-size:12px;color:#1a4d8f;line-height:1.65;white-space:pre-line;}

  /* 资金动作 */
  .pay{
    margin:10px auto;max-width:80%;background:linear-gradient(135deg,#fff,#ffe0e0);
    border:1.5px dashed #c62828;border-radius:12px;padding:10px 14px;text-align:center;
    font-size:12.5px;color:#b71c1c;line-height:1.5;animation:popin .4s ease both;
  }
  .pay .amt{font-size:18px;font-weight:bold;font-family:"Courier New",monospace;margin:4px 0;display:block;}
  .pay .amt.in{color:#2e7d32;}
  .pay .amt.out{color:#c62828;}
  .pay .arrow{font-size:14px;color:#999;margin:2px 0;}

  /* 打字指示 */
  .typing{display:flex;gap:4px;padding:10px 14px;}
  .typing span{width:7px;height:7px;background:#bbb;border-radius:50%;animation:blink 1.2s infinite both;}
  .typing span:nth-child(2){animation-delay:.2s;}
  .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,60%,100%{opacity:.3;transform:translateY(0);}30%{opacity:1;transform:translateY(-3px);}}

  /* ===== 选择区 ===== */
  .choices{
    padding:10px 12px 14px;background:linear-gradient(180deg,#fff,#f3f0ea);
    border-top:1px solid #e0d8cc;display:flex;flex-direction:column;gap:8px;min-height:78px;
    justify-content:center;box-shadow:0 -4px 12px rgba(0,0,0,.06);position:relative;z-index:6;
  }
  .choices .prompt{font-size:11px;color:#888;text-align:center;margin-bottom:2px;letter-spacing:1px;}
  .choice{
    width:100%;padding:11px 14px;border:none;border-radius:11px;font-size:13.5px;font-weight:bold;
    cursor:pointer;transition:all .18s;font-family:inherit;line-height:1.4;text-align:left;
    display:flex;align-items:center;gap:8px;animation:popin .3s ease both;
  }
  .choice+.choice{animation-delay:.09s;}
  .choice .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0;opacity:.7;}
  .choice.risk{background:linear-gradient(135deg,#fff3e0,#ffe0b2);color:#bf360c;border:1.5px solid #fb8c00;}
  .choice.risk:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(251,140,0,.3);}
  .choice.safe{background:linear-gradient(135deg,#e8f5e9,#c8e6c9);color:#1b5e20;border:1.5px solid #43a047;}
  .choice.safe:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(67,160,71,.3);}
  .choice.danger{background:linear-gradient(135deg,#ffebee,#ffcdd2);color:#b71c1c;border:1.5px solid #e53935;}
  .choice.danger:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(229,57,53,.35);}
  .choice:active{transform:scale(.98);}
  .choices.hide{display:none;}

  /* ===== 来电弹窗 ===== */
  .call{
    position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
    background:rgba(4,12,24,.78);opacity:0;pointer-events:none;transition:opacity .3s;
  }
  .call.show{opacity:1;pointer-events:auto;}
  .call-card{
    width:80%;background:linear-gradient(160deg,#12315e,#0b1f3d);border-radius:26px;
    padding:28px 22px;text-align:center;color:#fff;box-shadow:0 20px 50px rgba(0,0,0,.6);
    transform:translateY(16px);transition:transform .35s;
  }
  .call.show .call-card{transform:none;}
  .call-av{
    width:80px;height:80px;margin:0 auto 12px;border-radius:50%;
    background:linear-gradient(135deg,#42a5f5,#1565c0);
    display:flex;align-items:center;justify-content:center;font-size:36px;
    animation:ringPulse 1.1s ease-in-out infinite;
  }
  @keyframes ringPulse{0%,100%{box-shadow:0 0 0 0 rgba(66,165,245,.55);}50%{box-shadow:0 0 0 18px rgba(66,165,245,0);}}
  .call-name{font-size:18px;font-weight:bold;letter-spacing:1px;}
  .call-sub{font-size:11px;color:#9fc1ea;margin-top:4px;}
  .call-status{font-size:12px;color:#ffd54f;margin:14px 0 18px;letter-spacing:1px;}
  .call-btns{display:flex;justify-content:center;gap:30px;}
  .call-btns button{
    width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:transform .15s;
  }
  .call-btns button b{font-size:17px;font-weight:normal;line-height:1;}
  .call-btns button i{font-style:normal;font-size:9px;opacity:.9;}
  .call-btns button:active{transform:scale(.9);}
  .c-refuse{background:linear-gradient(135deg,#ef5350,#c62828);}
  .c-answer{background:linear-gradient(135deg,#66bb6a,#2e7d32);}

  /* 切换提示 toast */
  .toast{
    position:absolute;top:76px;left:50%;transform:translate(-50%,-10px);
    background:rgba(20,30,45,.9);color:#fff;font-size:12px;padding:8px 16px;border-radius:20px;
    z-index:70;opacity:0;pointer-events:none;transition:all .3s;letter-spacing:1px;white-space:nowrap;
    box-shadow:0 6px 16px rgba(0,0,0,.3);
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  /* ===== 结局遮罩 ===== */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;
    z-index:100;padding:20px;opacity:0;pointer-events:none;transition:opacity .4s;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .card{
    background:#fff;border-radius:22px;padding:30px 26px;max-width:480px;width:100%;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5);transform:scale(.9);transition:transform .4s;
    max-height:88vh;overflow-y:auto;
  }
  .overlay.show .card{transform:scale(1);}
  .card::before{content:"";display:block;height:5px;border-radius:4px;margin:-12px -6px 18px;}
  .card.fail::before{background:linear-gradient(90deg,#ff8a80,#e53935,#ff8a80);}
  .card.win::before{background:linear-gradient(90deg,#a5d6a7,#43a047,#a5d6a7);}
  .card .ic{font-size:54px;margin-bottom:8px;display:block;}
  .card h2{font-size:24px;margin-bottom:14px;}
  .card.fail h2{color:#c62828;}
  .card.win h2{color:#2e7d32;}
  .card .body{font-size:13.5px;line-height:1.7;color:#444;margin-bottom:18px;white-space:pre-line;}
  .card .vol{
    margin:-8px 0 14px;background:#fff8e1;border:1px dashed #f9a825;color:#7b5800;
    font-size:12px;border-radius:8px;padding:8px 10px;line-height:1.6;
  }
  .card .summary{
    background:#f5f5f5;border-left:4px solid #1a4d6e;border-radius:8px;padding:12px 14px;
    text-align:left;font-size:12.5px;line-height:1.65;color:#333;margin-bottom:16px;white-space:pre-line;
  }
  .card .slogan{
    background:linear-gradient(135deg,#1a4d6e,#0d5c5c);color:#fff;border-radius:10px;padding:14px;
    font-size:14px;line-height:1.7;margin-bottom:18px;white-space:pre-line;font-weight:bold;letter-spacing:1px;
  }
  .card .btn{
    background:linear-gradient(135deg,#1a4d6e,#0d5c5c);color:#fff;border:none;border-radius:11px;
    padding:13px 28px;font-size:15px;font-weight:bold;cursor:pointer;font-family:inherit;transition:all .18s;
  }
  .card .btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(13,92,92,.4);}
  .card .btn:active{transform:scale(.97);}

  /* 片头标题屏 */
  .title-screen{
    position:absolute;inset:0;background:linear-gradient(160deg,#0a2540,#1a4d6e 60%,#0d5c5c);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;padding:30px;text-align:center;z-index:50;overflow:hidden;
  }
  .title-screen::before{
    content:"";position:absolute;width:340px;height:340px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,138,101,.18),transparent 65%);
    top:-60px;right:-80px;animation:breathe 4s ease-in-out infinite;
  }
  .title-screen::after{
    content:"";position:absolute;width:280px;height:280px;border-radius:50%;
    background:radial-gradient(circle,rgba(66,165,245,.16),transparent 65%);
    bottom:-40px;left:-60px;animation:breathe 4s ease-in-out 2s infinite;
  }
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.8;}50%{transform:scale(1.15);opacity:1;}}
  .floats{position:absolute;inset:0;pointer-events:none;}
  .floats span{position:absolute;font-size:22px;opacity:.35;animation:floatUp 7s linear infinite;}
  .floats span:nth-child(1){left:8%;bottom:-8%;animation-delay:0s;}
  .floats span:nth-child(2){left:24%;bottom:-8%;animation-delay:2.2s;font-size:17px;}
  .floats span:nth-child(3){right:14%;bottom:-8%;animation-delay:1.1s;font-size:26px;}
  .floats span:nth-child(4){right:34%;bottom:-8%;animation-delay:3.6s;font-size:15px;}
  .floats span:nth-child(5){left:48%;bottom:-8%;animation-delay:4.8s;}
  @keyframes floatUp{0%{transform:translateY(0) rotate(0);opacity:0;}12%{opacity:.4;}88%{opacity:.3;}100%{transform:translateY(-92vh) rotate(24deg);opacity:0;}}
  .title-screen .tag{background:rgba(255,82,82,.2);border:1px solid #ff5252;color:#ffb0b0;
    font-size:11px;padding:4px 12px;border-radius:14px;margin-bottom:18px;letter-spacing:2px;position:relative;z-index:1;}
  .title-screen h1{font-size:26px;line-height:1.35;margin-bottom:12px;font-weight:bold;text-shadow:0 2px 10px rgba(0,0,0,.4);position:relative;z-index:1;}
  .title-screen h1 .h{color:#ff8a65;}
  .title-screen .desc{font-size:13px;color:#b0c4d8;line-height:1.7;margin-bottom:16px;max-width:310px;position:relative;z-index:1;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:24px;position:relative;z-index:1;}
  .chips span{font-size:10.5px;color:#cfe3f5;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);
    padding:4px 10px;border-radius:12px;letter-spacing:1px;}
  .title-screen .start{
    background:linear-gradient(135deg,#ff8a65,#e53935);color:#fff;border:none;border-radius:25px;
    padding:14px 46px;font-size:16px;font-weight:bold;cursor:pointer;font-family:inherit;
    box-shadow:0 8px 20px rgba(229,57,53,.4);transition:all .2s;position:relative;z-index:1;
  }
  .title-screen .start:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(229,57,53,.5);}
  .title-screen .start:active{transform:scale(.97);}

  // ============ 状态 ============
  let current="start";
  let busy=false;

  // ============ 播放引擎 ============
  async function play(){
    if(busy)return;busy=true;
    while(current){
      const node=nodes[current];
      if(!node){console.warn("未知节点:",current);break;}
      // 结局
      if(node.type==="ending"){showEnding(node.kind);current=null;break;}
      // 选择：停下等玩家
      if(node.type==="choice"){showChoices(node);current=null;break;}
      // 来电：等玩家接听/挂断
      if(node.type==="call"){
        const r=await showCall(node);
        current=(r==="answer"?node.next:node.refuse)||null;
        await sleep(350);
        continue;
      }
      switch(node.type){
        case "chapter": addChapter(node.text); await sleep(950); break;
        case "switch": switchConv(node.to); await sleep(650); break;
        case "narrate": addNarrate(node.text); await sleep(800); break;
        case "jobad": addJobad(node); await sleep(950); break;
        case "ai":
        case "police":
          showTyping();
          await sleep(Math.min(2400, 650 + node.text.length*26));
          hideTyping();
          addBubble(node.type, node.text, node.muted);
          await sleep(500);
          break;
        case "me": addBubble("me",node.text); await sleep(600); break;
        case "os": addOS(node.text); await sleep(1000); break;
        case "sys": addSys(node); await sleep(1000); break;
        case "pay": addPay(node); await sleep(850); break;
        case "group": addGroup(node); await sleep(800); break;
        case "gsys": addGSys(node.text); await sleep(650); break;
        case "appalert": addApp(node); await sleep(1100); break;
      }
      current=node.next||null;
      await sleep(60);
    }
    busy=false;
  }

  // ============ 启动 ============
  setTopbar("group");
  $("startBtn").addEventListener("click",()=>{
    $("titleScreen").classList.add("hide");
    setTimeout(play,500);
  });

})();
